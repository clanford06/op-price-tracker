sales:
  # --- Courtyard closed out, 2026-08-30 ---------------------------------
  # Everything left in the account was liquidated and withdrawn to the bank as
  # a single $78.35 ACH. Recorded as sales because this is the first time
  # Courtyard money became REAL money -- every prior movement was internal to
  # the wallet and correctly went unlogged.
  #
  # fees: 0.00 on both. The buyback price IS the net bid; there is no eBay cut
  # to take. That is why closing out is $9.25 better than the holdings figure
  # suggested -- the ledger had been haircutting the Alvida 13.25% for a sale
  # that never happened on eBay.
