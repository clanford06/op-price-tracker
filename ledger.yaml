# Expense and profit ledger.
#
# Three separate lists on purpose. Cards pulled from a box have no individual
# purchase price -- the box does -- so nothing here tries to invent one.
#
#   expenses  money that left your pocket
#   holdings  what you own now, with an estimated value
#   sales     money that came back, net of fees
#
#   net position = realised + unrealised - spent
#
# Seeded with what we established in conversation. Anything marked TODO is a
# number only you know. Until those are filled in the position is WRONG --
# missing costs make you look more profitable than you are.

settings:
  # eBay collectibles final value fee. Applies to item price AND the shipping
  # you charge, plus a flat per-order fee. Change if your category differs.
  fee_pct: 13.25
  fee_flat: 0.40

  # Last time holdings were rebuilt from the TCGplayer app export. Bump this
  # whenever the collection is re-synced. The dashboard and the reminder job
  # both read it, because a stale collection understates the position exactly
  # as badly as a stale expense list overstates it.
  collection_synced:
    one-piece-card-game: 2026-09-28
    pokemon: 2026-09-28
    yugioh: 2026-09-28

  # Which tag each product line's holdings roll up under. One Piece is left
  # blank so it keeps its per-set tags (op17, st32, ...) and its own P/L.
  collection_tags:
    Pokemon: pokemon
    Pokemon Japan: pokemon
    YuGiOh: yugioh

  # WHO ACTUALLY OWNS IT. Most of the Pokemon collection is 50/50 with Carter's
  # brother, so only half of it may reach the position -- otherwise the ledger
  # claims money that is not his to claim. The cards stay at full market value
  # and `owned_share` carries the split, because discounting the card instead
  # would misstate what the card is worth.
  #
  # The 30th anniversary product is his alone; he bought it himself. Yu-Gi-Oh
  # and One Piece are wholly his and need no rule.
  ownership:
    Pokemon:
      share: 0.5
      full_share_sets:
        - "ME: 30th Celebration"        # prefix, so it also covers
                                        # "ME: 30th Celebration Classic Collection"
    Pokemon Japan:
      share: 0.5

  # Product ids that must NEVER be imported from the app export. Carter tracks
  # his slabs in the app next to everything else, but the app prices the RAW
  # card, and a graded card is a different asset with its own market.
  #   695324  Ms. All Sunday (SP) OP14-084 -- at PSA, carried at a reasoned
  #           floor with grade scenarios; the app says $527.10 raw
  #   671450  Eustass"Captain"Kid EB04-039 (SP) -- PSA 10 at $169; raw is $88.66
  graded_product_ids: [695324, 671450]

