holdings:
  # =====================================================================
  # HOLDINGS REBUILT 2026-09-04 from Carter's TCGplayer app inventory
  # (8 screenshots, list "OP-TCG", 51 items, $1,832.64 est. market).
  # The transcription reconciles to the app exactly: 39 distinct lines,
  # 51 total copies, $1,832.64. Every line below was matched to its
  # TCGplayer product by CARD NUMBER and then disambiguated by PRICE --
  # which is what separates Kaido (063) Alt at $12.18 from Kaido (063)
  # base at $0.48, and the same for Usopp 080 and Newgate 005. Matching
  # on number alone would have collapsed each of those pairs.
  #
  # The app list is Carter's ~51 BEST cards, not the whole collection.
  # Everything else is the bulk line at the bottom.
  #
  # TWO CARDS ARE DELIBERATELY NOT AUTO-PRICED, and must stay that way:
  # Ms. All Sunday (at PSA) and the PSA 10 Kidd. TCGplayer prices RAW
  # singles; a slab is its own market. Pinning either to a tcgplayer_id
  # would overwrite a graded value with a raw one -- for Ms. All Sunday
  # that is a ~$37 overstatement of a card that isn't raw, and for the
  # Kidd it is an $80 UNDERSTATEMENT ($88.84 raw vs $169 as a PSA 10).
  # =====================================================================

  # ---------------------------------------------------------------------
  # MANUAL HOLDINGS. These sit ABOVE the generated region on purpose and
  # survive every --import-collection run.
  #
  # Both slabs DO appear in Carter's TCGplayer app list, and both must stay
  # out of the import: the app quotes the RAW card, and a graded card is a
  # different asset from the card inside it. Importing them would rewrite
  # Ms. All Sunday's reasoned $500 floor and its grade scenarios with a $527
  # raw quote, and drop the PSA 10 Kidd from $169 to $88.66. Their product
  # ids are listed in settings.graded_product_ids to block exactly that.
  # ---------------------------------------------------------------------

  - id: ms-all-sunday-sp
    tag: "msallsunday"
    name: "Ms. All Sunday SP OP14-084 (English)"
    status: grading
    estimate: 500.00
    acquired: "2026-07"
    source: "pulled from OP-16 box"
    note: "At PSA, order #27355838. First View images 2026-08-26, est. complete 2026-11-23 to 2026-12-09. Carried at the FLOOR -- the grade is not known yet, so the position must not assume one. A 10 is the likely outcome and is worth roughly double; see the grade breakdown."
    ebay_query: "Ms All Sunday OP14-084 SP English"
    # What it is worth per grade, at today's comps. These are shown, never
    # counted: the card is booked at the floor above until PSA says otherwise.
    scenarios:
      - label: "PSA 10"
        estimate: 1150.00
        share: 0.9324
        note: "455 of 488 graded copies. Roughly double raw -- the outcome that justified submitting."
      - label: "PSA 9"
        estimate: 500.00
        share: 0.0451
        note: "Only one on record: $760 on 2026-07-05 when 10s were $1,725, i.e. 44% of a 10. At or below raw."
      - label: "PSA 8 or lower"
        estimate: 510.00
        share: 0.0225
        note: "One sold 2026-08-02 at $510, under what raw was fetching that week."
    # ---------------------------------------------------------------------
    # REPRICED 2026-08-30, from $650.00 -> $1,106.27 -> $500.00. The $650 was
    # a placeholder set before there were comps. The $1,106 was the
    # probability-weighted value across grades, and Carter was right to reject
    # it: 93% of that number is the PSA 10 branch, so booking it quietly
    # asserts a grade nobody has seen. The card is now carried at the FLOOR --
    # what it is worth if it comes back a 9, which is also roughly what an 8
    # fetches -- and every grade outcome lives in `scenarios` above, shown on
    # the dashboard behind a drop-down rather than counted in the position.
    #
    # This is the same rule as the Oden and the Kaido: book the low end, let
    # the upside be upside. The position can only be surprised upward.
    #
    # NOT auto-priced on purpose. TCGplayer sells RAW singles; a slab is its
    # own market. Giving this a `tcgplayer_id` would quietly overwrite the
    # graded value with the ~$566 raw price and lose half the position.
    #
    # PSA POP REPORT (n=488, set released 2026-06-12):
    #     PSA 10        455   93.24%   x $1,150  = $1,072.23
    #     PSA 9          22    4.51%   x $  500  = $   22.54
    #     PSA 8 or less  11    2.25%   x $  510  = $   11.50
    #                                    EV      = $1,106.27   <- NOT booked
    # Kept here because it is the right number for deciding whether grading was
    # worth it. It is the wrong number for a ledger line, which has to survive
    # being wrong about one specific card.
    #
    # A 10 is the strong base case: 93.2% gem, 96.5% come back 9 or better.
    # Call it 90-95% allowing for the one thing the images cannot settle --
    # centering, which is judged off the back and is what generates most of
    # those 22 nines. The other three failure modes (corners, edges, surface)
    # looked clean at high resolution. The bright line along the bottom back
    # edge is a light reflection, not whitening: ~0.15mm, green-channel
    # dominant (picking up the surface under it), and perfectly uniform edge
    # to edge, which is what a light source does and wear never does.
    #
    # A 9 IS A BAD OUTCOME, worse than the pop split suggests. The only PSA 9
    # on record sold $760 on 2026-07-05 when 10s were ~$1,725 -- 44% of a 10.
    # At today's level that ratio lands near $500, i.e. AT OR BELOW RAW. The
    # PSA 8 that sold 2026-08-02 went for $510, also below raw that week.
    # Below a 10, grading this card destroyed value rather than adding it.
    #
    # THE REAL RISK IS THE PRICE, NOT THE GRADE:
    #     PSA 10   ~$2,200 late June  ->  ~$1,150 now      -48% in 10 weeks
    #     Raw NM    $500-630 (TCGplayer market ~$566)      -20% same period
    # Roughly $100-150 a week off a 10, with no floor yet, because the 10 pop
    # keeps growing while the set is still being opened -- 0 to 488 graded in
    # 11 weeks. The $1,106 above uses TODAY's comps for a card that cannot be
    # sold for ~12 more weeks. Do not treat it as what the check will say.
    #
    # AND THE COMPETITION ARRIVES FIRST:
    #   Oct 2026  EB-05 Heroines Edition vol. 2 -- Nico Robin leader
    #   Nov 2026  OP-18 "The Dominance of God" -- OP18-031, Robin's FIRST
    #             Manga Rare, Water 7 / Enies Lobby art (~1 per case, ~1 in
    #             288 packs). Manga Rare outranks SP; it becomes "the" Robin
    #             card. Both are pre-timeskip, so they compete for the same
    #             buyer rather than opening a second niche.
    # Set date is unconfirmed by Bandai and much of the checklist is still
    # leaks; retailers point at Nov 20. That is the same week this slab is
    # due back, which is the worst available collision.
    #
    # DECISION THAT ACTUALLY MATTERS: list on arrival or hold for years.
    # Waiting a quarter to "see if it bounces" is neither, and is how a card
    # rides $2,200 down to $800. Also worth confirming the service tier on
    # the order page -- Express would have it back in October, ahead of both
    # sets, and Regular is what puts it back in late November. Value tiers
    # have been paused since 2026-06-02 (backlog ~11.85M units), so it is
    # one of those two.
    # ---------------------------------------------------------------------


