# What to track. Edit freely -- this is the only file you need to touch day to day.
#
# Every product inherits `defaults` and can override any key.
# Matching is done on the normalised listing title: punctuation is stripped and
# case is ignored, so "OP-17", "OP 17" and "op17" are all compared the same way.
# Terms match whole words only, so "case" will not fire inside "showcase".

defaults:
  # Sanity bounds passed to eBay. Anything outside is never even returned.
  min_price: 35
  max_price: 500

  # Must be an actual BOOSTER box. Requiring only "box" matched Illustration
  # Boxes and DP-11 Double Packs, which live in the same eBay category and
  # dragged the median from ~$227 down to ~$55.
  require_all:
    - booster box

  # Reject anything that is not a plain sealed English booster box.
  exclude_any:
    # Wrong language printing
    - japanese
    - japan
    - jpn
    - jp
    - korean
    - chinese
    # Not a sealed box
    - empty
    - open
    - opened
    - unsealed
    - resealed
    - bulk
    - illustration box
    - double pack
    - wrapper
    - wrappers
    - single
    - singles
    - starter deck
    - deck box
    - sleeve
    - sleeves
    - playmat
    - binder
    # Group breaks and gambling formats, not a product you receive
    - break
    - breaks
    - spot
    - spots
    - random
    - repack
    - repacks
    - mystery
    # Counterfeit / not-the-real-thing signals
    - proxy
    - proxies
    - custom
    - replica
    - fake
    # Different unit of sale -- a case is 12 boxes and wrecks price comparison
    - case
    - lot

  # ---- VETOES: any one of these disqualifies a listing outright ----------

  min_seller_score: 100        # minimum completed sales
  min_seller_pct: 98.0         # minimum positive feedback percentage
  require_returns: false       # SCORED, not vetoed -- see note below
  require_us_location: true    # reject items shipping from outside the US
  # Live calibration 2026-08-11: require_returns=true vetoed 8/8 OP-16 and 6/8
  # OP-14 listings. No-returns is standard for sealed TCG (it blocks buyers
  # swapping contents and returning), so vetoing on it rejected the whole
  # market. It still costs 12 points in the trust score.
  require_verified_detail: true  # reject anything whose details will not load

  # Hard price floor, applied no matter how few listings came back. A newly
  # released set often has only two or three listings, and that is exactly when
  # a counterfeit would otherwise be crowned "cheapest". Set to a price no
  # genuine sealed box of that set would ever go below (~55-65% of market).
  implausible_below: null

  # A seller holding this many sealed boxes of a hot set is a distributor or a
  # problem. Above it, the stock-level signal scores zero (not a veto).
  max_quantity: 12

  # ---- SCORE: listings must clear this to be recommended -----------------

  # 0-100, weighted across language verification, seller volume and rating,
  # returns, Top Rated status, price plausibility, item specifics, category,
  # stock level, eBay programmes and description. Raise it to be stricter;
  # 85+ will reject most listings, which is a legitimate choice.
  min_trust_score: 70

  # How many of the cheapest relevant listings get a full detail fetch and
  # score. Each costs one API call. The cheapest are both the ones you would
  # buy and the ones most likely to be fake, so checking those is what matters.
  verify_top_n: 8

  # ---- PURCHASE SCORING --------------------------------------------------

  unit_kind: box               # box | pack -- changes how cost/pack is derived
  packs_in_unit: 24            # English booster box = 24 packs

  # Estimated singles value per pack, from community pull rates. Bandai
  # publishes none, so this is an assumption made explicit rather than left in
  # your gut. Worked example for a typical set, per 24-pack box:
  #     SP    0.2/box x ~$150 avg  =  $30   (1 SP per 5-6 boxes; most SPs are
  #                                          NOT the $650 chase card)
  #     SR    7/box   x ~$8   avg  =  $56
  #     bulk  rares/uncommons      =  $30
  #                                 -------
  #                            box   $116  ->  ~$4.83 per pack
  # Against ~$8.75/pack for a $210 box, that is the arithmetic reason opening
  # boxes loses money on average. Adjust per set as you learn real numbers.
  ev_per_pack: 4.83

  # SPs per box. Community estimates cluster around 1 per 12-box case (~0.083)
  # up to 1 per 5-6 boxes (~0.2) depending on set. Using the pessimistic end,
  # because the point of this number is to show how often a box is a dud.
  #
  # NOTE ON "CASE MAPPING": in older Pokemon sets, hits sat in predictable
  # positions within a case, so a broken case left genuinely worthless boxes.
  # Community consensus is that this does NOT hold for One Piece -- the
  # distribution is genuinely variable (people pull 2 SECs in one box then
  # nothing for three). There is no documented date when Bandai "fixed" it,
  # because there is no evidence One Piece was ever reliably mappable.
  # What IS true is the base rate: most boxes contain no SP. That is what
  # dud_chance shows.
  sp_per_box: 0.12

  # Sellers you have bought from successfully (bonus points), and sellers you
  # never want to see again (instant veto). Use exact eBay usernames.
  trusted_sellers: []
  blocked_sellers: []

products:
  - id: op17
    name: "OP-17 The World's Strongest Warriors"
    query: "One Piece Card Game OP-17 Booster Box"
    require_any: ["op 17", "op17", "worlds strongest warriors", "world s strongest warriors"]
    alert_below: 110          # <-- set to what you'd actually pay
    implausible_below: 75     # <-- no genuine sealed OP-17 box goes under this

  - id: op16
    name: "OP-16 The Time of Battle"
    query: "One Piece Card Game OP-16 Booster Box"
    require_any: ["op 16", "op16", "time of battle"]
    alert_below: 100
    implausible_below: 100

  - id: op14
    name: "OP-14 The Azure Sea's Seven"
    query: "One Piece Card Game OP-14 Booster Box"
    require_any: ["op 14", "op14", "azure sea s seven", "azure seas seven"]
    alert_below: 95
    implausible_below: 178

  - id: op01
    name: "OP-01 Romance Dawn"
    query: "One Piece Card Game OP-01 Romance Dawn Booster Box"
    require_any: ["op 01", "op1", "op01", "romance dawn"]
    min_price: 60
    max_price: 900
    alert_below: 250
    implausible_below: 180

  # ---- LOOSE PACKS -------------------------------------------------------
  # Tracked so you can SEE the premium, not because they are a good buy.
  # Carter's 16 loose packs cost $9.71 each against ~$7.68/pack buying the box.

  - id: op17-packs
    name: "OP-17 loose packs"
    query: "One Piece Card Game OP-17 booster pack"
    require_all: ["booster pack"]
    require_any: ["op 17", "op17", "worlds strongest warriors", "world s strongest warriors"]
    unit_kind: pack
    packs_in_unit: 1
    min_price: 3
    max_price: 60
    implausible_below: 3
    alert_below: 5
    exclude_any: &pack_excludes
      - japanese
      - japan
      - jpn
      - jp
      - korean
      - chinese
      - booster box
      - box
      - case
      - lot
      - bundle
      - empty
      - wrapper
      - single
      - singles
      - proxy
      - custom
      - replica
      - fake
      # Weighed / searched packs. The seller has already scaled them and knows
      # what is inside; you are buying a pack they chose to sell you.
      - heavy
      - heavies
      - weighed
      - weighted
      - searched
      - gram
      - grams
      - g
      - repack
      - repacks
      - mystery
      - random
      - break
      - spot

  - id: op16-packs
    name: "OP-16 loose packs"
    query: "One Piece Card Game OP-16 booster pack"
    require_all: ["booster pack"]
    require_any: ["op 16", "op16", "time of battle"]
    unit_kind: pack
    packs_in_unit: 1
    min_price: 3
    max_price: 60
    implausible_below: 3
    alert_below: 5
    exclude_any: *pack_excludes

# Add more sets by copying a block above and changing id / name / query /
# require_any. Set codes are the reliable matcher -- always include both the
# spaced and unspaced form ("op 15" and "op15"), since eBay sellers write both.
