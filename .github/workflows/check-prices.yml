name: Check box prices

on:
  schedule:
    # Every 2 hours. GitHub cron is UTC and fires late under load -- that is
    # fine here, since we care about price movement, not exact timing.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      explain:
        description: "Print why each listing was kept or rejected"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs write docs/data.json at once.
concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Gate the run on the verification tests. If a threshold or phrase list
      # was edited badly, fail here rather than quietly recommending a fake.
      - name: Verify safety checks still hold
        run: python -m pytest tests/ -q

      # Re-quote the singles first so docs/data.json is written with card
      # values from this run rather than from whenever the twice-daily job last
      # fired. Without this the dashboard could show a portfolio total up to
      # 12 hours out of step with the prices printed beside it.
      - name: Refresh card values
        continue-on-error: true
        run: python -m tracker --card-prices

      - name: Check prices
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          ALERT_ON_NEW_LOW: ${{ vars.ALERT_ON_NEW_LOW || 'true' }}
        run: |
          python -m tracker ${{ inputs.explain && '--explain' || '' }}

      - name: Commit updated prices
        run: |
          git config user.name  "op-price-tracker"
          git config user.email "actions@github.com"

          # docs/data.json is generated output, so this run's freshly computed
          # prices always win. Rebasing a generated file against a concurrent
          # run conflicts every time and fails the job; resetting onto the
          # remote tip and re-laying our file down is deterministic.
          cp docs/data.json /tmp/data.json
          cp docs/cardprices.json /tmp/cardprices.json
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp /tmp/data.json docs/data.json
          cp /tmp/cardprices.json docs/cardprices.json

          git add docs/data.json docs/cardprices.json
          if git diff --staged --quiet; then
            echo "No price change."
          else
            git commit -m "prices: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
