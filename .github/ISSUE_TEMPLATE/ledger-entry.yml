name: Add a ledger entry
description: Log an expense, sale, or holding
labels:
  - ledger
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      default: 0
      options:
        - expense
        - sale
        - holding

  - type: input
    id: description
    attributes:
      label: What was it
    validations:
      required: true

  - type: input
    id: amount
    attributes:
      label: Amount
    validations:
      required: true

  - type: input
    id: shipping
    attributes:
      label: Shipping

  - type: input
    id: fees
    attributes:
      label: Fees

  - type: input
    id: tag
    attributes:
      label: Tag
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      default: 0
      options:
        - sealed
        - singles
        - grading
        - supplies
        - events
        - other

  - type: input
    id: date
    attributes:
      label: Date
